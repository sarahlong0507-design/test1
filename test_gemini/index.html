<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ocean Members Dashboard</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- 自訂 CSS 與 Antigravity 動態特效 -->
    <style>
        /* 定義無重力懸浮動畫 */
        @keyframes float {

            0%,
            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        /* 懸浮卡片類別 */
        .antigravity-float {
            animation: float 6s ease-in-out infinite;
        }

        .antigravity-float-delayed {
            animation: float 7s ease-in-out infinite 1.5s;
        }

        /* 深色蕾絲主題與自訂卷軸 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #171018;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(190, 125, 146, 0.55);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(222, 164, 181, 0.8);
        }

        body {
            color: #f2e7e5;
            background:
                radial-gradient(ellipse at 18% 8%, rgba(89, 39, 62, 0.4), transparent 34rem),
                radial-gradient(ellipse at 85% 65%, rgba(59, 28, 48, 0.42), transparent 38rem),
                #100c12;
        }

        body::before {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            content: "";
            opacity: 0.16;
            background-image: repeating-linear-gradient(135deg, transparent 0 18px, rgba(233, 193, 201, 0.08) 19px, transparent 20px 38px);
        }

        body::after {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            content: "";
            background-image:
                linear-gradient(90deg, rgba(16, 12, 18, 0.96) 0%, rgba(16, 12, 18, 0.78) 42%, rgba(16, 12, 18, 0.2) 76%, rgba(16, 12, 18, 0.52) 100%),
                linear-gradient(180deg, rgba(16, 12, 18, 0.18), rgba(16, 12, 18, 0.72)),
                url("https://images.unsplash.com/photo-1529139574466-a303027c1d8b?auto=format&fit=crop&w=1800&q=82");
            background-position: center, center, right 38% center;
            background-repeat: no-repeat;
            background-size: cover, cover, cover;
            filter: saturate(0.72) sepia(0.08) brightness(0.68);
            opacity: 0.42;
        }

        body [class*="text-slate-"] {
            color: #e6d8d8 !important;
        }

        body [class*="text-cyan-"],
        body [class*="text-teal-"],
        body [class*="text-sky-"] {
            color: #e4b4c1 !important;
        }

        body [class*="border-cyan-"],
        body [class*="border-teal-"],
        body [class*="border-sky-"] {
            border-color: rgba(190, 125, 146, 0.34) !important;
        }

        body [class*="bg-white"] {
            background-color: #1d151e !important;
        }

        body [class*="bg-cyan-"],
        body [class*="bg-teal-"],
        body [class*="bg-sky-"] {
            background-color: rgba(105, 51, 72, 0.34) !important;
        }

        body [class~="bg-[#effaff]"] {
            background-color: #100c12 !important;
        }

        .max-w-7xl > header h1[class] {
            color: #f0d7dc;
            background-image: linear-gradient(110deg, #f1dfe0 8%, #d89eaf 52%, #a9657d 92%) !important;
            filter: drop-shadow(0 3px 18px rgba(183, 104, 132, 0.28));
        }

        .max-w-7xl > header h1[class]::before,
        .max-w-7xl > header h1[class]::after {
            color: #d6a6b3;
            -webkit-text-fill-color: #d6a6b3;
            font-size: 0.55em;
            vertical-align: 0.2em;
        }

        .max-w-7xl > header h1[class]::before {
            content: "✧";
            margin-right: 0.45em;
        }

        .max-w-7xl > header h1[class]::after {
            content: "✧";
            margin-left: 0.45em;
        }

        .max-w-7xl > header p {
            color: #c9aeb8 !important;
        }

        [class~="lg:col-span-4"],
        [class~="lg:col-span-8"],
        section[aria-labelledby="world-clock-title"] {
            background: linear-gradient(145deg, rgba(39, 26, 37, 0.96), rgba(24, 17, 26, 0.96)) !important;
            border-color: rgba(190, 125, 146, 0.42) !important;
            box-shadow: 0 18px 55px rgba(0, 0, 0, 0.38), inset 0 1px rgba(248, 220, 227, 0.06);
        }

        [class~="lg:col-span-4"]:hover,
        [class~="lg:col-span-8"]:hover {
            border-color: rgba(222, 164, 181, 0.7) !important;
            box-shadow: 0 18px 55px rgba(0, 0, 0, 0.42), 0 0 28px rgba(158, 82, 111, 0.16);
        }

        input,
        select {
            color: #f2e7e5 !important;
            background-color: #171018 !important;
            border-color: rgba(190, 125, 146, 0.42) !important;
        }

        input::placeholder {
            color: #a996a0 !important;
        }

        input:focus,
        select:focus {
            border-color: #d89eaf !important;
            --tw-ring-color: rgba(216, 158, 175, 0.25) !important;
        }

        select option {
            color: #f2e7e5;
            background: #1d151e;
        }

        #submitBtn {
            color: #fff7f5;
            background-image: linear-gradient(110deg, #71354e, #a65c75 58%, #744158);
            box-shadow: 0 8px 24px rgba(126, 53, 79, 0.24);
        }

        #submitBtn:hover {
            background-image: linear-gradient(110deg, #87435f, #bd7188 58%, #8e4c67);
        }

        section[aria-labelledby="world-clock-title"] article {
            background: linear-gradient(145deg, rgba(75, 43, 59, 0.42), rgba(28, 20, 29, 0.78)) !important;
            border-color: rgba(190, 125, 146, 0.27) !important;
        }

        table thead tr {
            background-color: rgba(105, 51, 72, 0.3) !important;
        }

        table tbody tr:hover {
            background-color: rgba(105, 51, 72, 0.22) !important;
        }

        #loadingOverlay {
            background-color: rgba(24, 17, 26, 0.94) !important;
        }

        #loadingOverlay [class*="border-cyan-"] {
            border-color: rgba(190, 125, 146, 0.28) !important;
        }

        #loadingOverlay [class*="border-teal-"] {
            border-top-color: transparent !important;
            border-right-color: #d89eaf !important;
            border-bottom-color: #d89eaf !important;
            border-left-color: #d89eaf !important;
        }

        #toastContent {
            background-color: rgba(29, 21, 30, 0.97) !important;
            border-color: rgba(190, 125, 146, 0.52) !important;
            color: #f2e7e5 !important;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45), 0 0 24px rgba(158, 82, 111, 0.14);
        }

        @media (prefers-reduced-motion: reduce) {
            .antigravity-float,
            .antigravity-float-delayed {
                animation: none;
            }
        }
    </style>
</head>

<body
    class="bg-[#effaff] text-slate-800 min-h-screen relative overflow-x-hidden font-sans selection:bg-cyan-200 selection:text-slate-900">

    <!-- 深海光暈裝飾 -->
    <div class="absolute top-0 left-1/4 w-96 h-96 bg-cyan-300/30 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute bottom-10 right-1/4 w-96 h-96 bg-teal-300/25 rounded-full blur-3xl pointer-events-none">
    </div>

    <!-- 主容器 -->
    <div class="max-w-7xl mx-auto px-4 py-12 relative z-10">

        <div class="flex justify-end mb-4">
            <button type="button" onclick="showCartCount()" aria-label="購物車，目前 0 件商品"
                class="inline-flex items-center gap-2 rounded-xl border border-cyan-700/20 bg-white/85 px-4 py-2 text-sm font-semibold text-cyan-800 shadow-sm transition-all duration-200 hover:border-cyan-600/40 hover:bg-cyan-50 hover:text-cyan-950 focus:outline-none focus:ring-2 focus:ring-cyan-500/40">
                <svg class="h-5 w-5 text-cyan-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                    aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                        d="M3 3h2l2.2 11.1a2 2 0 002 1.6h8.9a2 2 0 002-1.6L22 7H6M10 21a1 1 0 100-2 1 1 0 000 2zm8 0a1 1 0 100-2 1 1 0 000 2z">
                    </path>
                </svg>
                <span>購物車</span>
                <span id="cartCount"
                    class="inline-flex min-w-6 items-center justify-center rounded-full bg-cyan-100 px-2 py-0.5 text-xs text-cyan-800">0</span>
            </button>
        </div>

        <!-- 標題區 -->
        <header class="text-center mb-12 antigravity-float">
            <h1
                class="text-4xl md:text-5xl font-extrabold tracking-wider bg-gradient-to-r from-cyan-700 via-teal-600 to-sky-700 bg-clip-text text-transparent drop-shadow-[0_2px_12px_rgba(8,145,178,0.18)]">
                OCEAN MEMBERS
            </h1>
            <p class="text-cyan-800/70 mt-2 text-sm md:text-base tracking-widest uppercase">Ocean Data Control
                Interface</p>
        </header>

        <!-- 雙欄排版：左側表單 / 右側表格 -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">

            <!-- 1. 左側：新增會員表單 (佔 4 欄) -->
            <div
                class="lg:col-span-4 backdrop-blur-md bg-white/85 border border-cyan-200 rounded-2xl p-6 md:p-8 shadow-[0_16px_48px_rgba(14,116,144,0.10)] antigravity-float transition-all duration-300 hover:border-cyan-400 hover:shadow-[0_0_32px_rgba(34,211,238,0.18)]">
                <h2 class="text-xl font-bold text-cyan-900 mb-6 flex items-center gap-2">
                    <svg class="w-5 h-5 text-cyan-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z">
                        </path>
                    </svg>
                    新增會員資料
                </h2>

                <form id="memberForm" class="space-y-5">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-2">姓名
                            (Name)</label>
                        <input type="text" id="name" required placeholder="請輸入姓名..."
                            class="w-full bg-white border border-cyan-200 rounded-xl px-4 py-3 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:border-cyan-500 focus:ring-2 focus:ring-cyan-500/20 transition-all duration-300">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-2">電子郵件
                            (Email)</label>
                        <input type="email" id="email" required placeholder="name@example.com"
                            class="w-full bg-white border border-cyan-200 rounded-xl px-4 py-3 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:border-cyan-500 focus:ring-2 focus:ring-cyan-500/20 transition-all duration-300">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-2">角色等級
                            (Role)</label>
                        <select id="role" required
                            class="w-full bg-white border border-cyan-200 rounded-xl px-4 py-3 text-sm text-slate-800 focus:outline-none focus:border-cyan-500 focus:ring-2 focus:ring-cyan-500/20 transition-all duration-300">
                            <option value="" disabled selected>請選擇角色等級</option>
                            <option value="管理員" class="bg-white text-cyan-800">管理員</option>
                            <option value="進階會員" class="bg-white text-sky-800">進階會員</option>
                            <option value="一般會員" class="bg-white text-teal-800">一般會員</option>
                        </select>
                    </div>

                    <button type="submit" id="submitBtn"
                        class="w-full mt-4 bg-gradient-to-r from-cyan-700 to-teal-600 hover:from-cyan-600 hover:to-teal-500 text-white font-bold py-3.5 px-6 rounded-xl shadow-[0_0_22px_rgba(6,182,212,0.18)] hover:shadow-[0_0_30px_rgba(45,212,191,0.28)] transform hover:-translate-y-0.5 transition-all duration-300 cursor-pointer flex items-center justify-center gap-2">
                        <span>加入會員</span>
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                        </svg>
                    </button>
                </form>
            </div>

            <!-- 2. 右側：會員資料表格 (佔 8 欄) -->
            <div
                class="lg:col-span-8 backdrop-blur-md bg-white/85 border border-teal-200 rounded-2xl p-6 md:p-8 shadow-[0_16px_48px_rgba(14,116,144,0.10)] antigravity-float-delayed transition-all duration-300 hover:border-teal-400 hover:shadow-[0_0_32px_rgba(45,212,191,0.18)]">
                <div class="flex items-center justify-between mb-6">
                    <h2 class="text-xl font-bold text-teal-900 flex items-center gap-2">
                        <svg class="w-5 h-5 text-teal-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4">
                            </path>
                        </svg>
                        海洋資料庫清單
                    </h2>
                    <button onclick="fetchMembers()"
                        class="text-xs text-cyan-800 hover:text-cyan-950 border border-cyan-700/25 px-3 py-1.5 rounded-lg hover:bg-cyan-50 transition-all duration-200 cursor-pointer flex items-center gap-1.5">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15">
                            </path>
                        </svg>
                        重新整理
                    </button>
                </div>

                <!-- 表格容器 -->
                <div class="overflow-x-auto relative min-h-[300px] flex flex-col justify-center">

                    <!-- 海流光效載入動畫遮罩 -->
                    <div id="loadingOverlay"
                        class="absolute inset-0 bg-white/90 backdrop-blur-sm flex flex-col items-center justify-center z-20 transition-opacity duration-300">
                        <div class="relative w-16 h-16">
                            <div class="absolute inset-0 rounded-full border-4 border-cyan-200"></div>
                            <div
                                class="absolute inset-0 rounded-full border-4 border-teal-500 border-t-transparent animate-spin shadow-[0_0_18px_rgba(45,212,191,0.35)]">
                            </div>
                        </div>
                        <span
                            class="text-cyan-800 text-sm mt-4 tracking-widest animate-pulse font-medium">資料傳輸中...</span>
                    </div>

                    <!-- 表格本體 -->
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-cyan-200 bg-cyan-50/70 text-slate-600 text-xs uppercase tracking-wider">
                                <th class="py-3 px-4 font-semibold">ID</th>
                                <th class="py-3 px-4 font-semibold">姓名</th>
                                <th class="py-3 px-4 font-semibold">Email</th>
                                <th class="py-3 px-4 font-semibold">角色</th>
                            </tr>
                        </thead>
                        <tbody id="memberTableBody" class="divide-y divide-cyan-100 text-sm text-slate-700">
                            <!-- 動態渲染資料插入點 -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>

        <section aria-labelledby="world-clock-title"
            class="mt-10 rounded-2xl border border-cyan-200 bg-white/80 p-6 md:p-8 shadow-[0_16px_48px_rgba(14,116,144,0.08)]">
            <div class="mb-5">
                <h2 id="world-clock-title" class="flex items-center gap-2 text-xl font-bold text-cyan-900">
                    <svg class="h-5 w-5 text-cyan-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                        aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                            d="M12 8v4l3 2m6-2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    世界時區時鐘
                </h2>
                <p class="mt-1 text-sm text-slate-500">即時查看不同城市的當地時間</p>
            </div>
            <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-5">
                <article class="rounded-xl border border-cyan-100 bg-gradient-to-br from-cyan-50 to-white p-4">
                    <h3 class="text-sm font-semibold text-cyan-900">台北</h3>
                    <time id="clock-taipei" class="mt-2 block text-2xl font-bold tabular-nums text-slate-800">--:--:--</time>
                    <p id="date-taipei" class="mt-1 text-xs text-slate-500">載入日期…</p>
                </article>
                <article class="rounded-xl border border-cyan-100 bg-gradient-to-br from-cyan-50 to-white p-4">
                    <h3 class="text-sm font-semibold text-cyan-900">東京</h3>
                    <time id="clock-tokyo" class="mt-2 block text-2xl font-bold tabular-nums text-slate-800">--:--:--</time>
                    <p id="date-tokyo" class="mt-1 text-xs text-slate-500">載入日期…</p>
                </article>
                <article class="rounded-xl border border-cyan-100 bg-gradient-to-br from-cyan-50 to-white p-4">
                    <h3 class="text-sm font-semibold text-cyan-900">新加坡</h3>
                    <time id="clock-singapore" class="mt-2 block text-2xl font-bold tabular-nums text-slate-800">--:--:--</time>
                    <p id="date-singapore" class="mt-1 text-xs text-slate-500">載入日期…</p>
                </article>
                <article class="rounded-xl border border-cyan-100 bg-gradient-to-br from-cyan-50 to-white p-4">
                    <h3 class="text-sm font-semibold text-cyan-900">倫敦</h3>
                    <time id="clock-london" class="mt-2 block text-2xl font-bold tabular-nums text-slate-800">--:--:--</time>
                    <p id="date-london" class="mt-1 text-xs text-slate-500">載入日期…</p>
                </article>
                <article class="rounded-xl border border-cyan-100 bg-gradient-to-br from-cyan-50 to-white p-4">
                    <h3 class="text-sm font-semibold text-cyan-900">紐約</h3>
                    <time id="clock-new-york" class="mt-2 block text-2xl font-bold tabular-nums text-slate-800">--:--:--</time>
                    <p id="date-new-york" class="mt-1 text-xs text-slate-500">載入日期…</p>
                </article>
            </div>
        </section>
    </div>

    <!-- 自訂美化提示框 (Toast / Modal) -->
    <div id="toastNotification"
        class="fixed bottom-6 right-6 z-50 transform translate-y-24 opacity-0 transition-all duration-300 pointer-events-none">
        <div id="toastContent"
            class="backdrop-blur-md bg-white/95 border border-cyan-300 text-slate-800 px-6 py-4 rounded-xl shadow-[0_0_30px_rgba(6,182,212,0.18)] flex items-center gap-3">
            <span id="toastIcon">✨</span>
            <span id="toastMessage" class="text-sm font-medium">提示訊息</span>
        </div>
    </div>

    <!-- JavaScript 邏輯 -->
    <script>
        // 留空或使用占位符提醒更換的 API_URL
        const API_URL = "https://script.google.com/macros/s/AKfycbzYP3ngTDRs9qLZ_gVqHPixODWhGKb4ql8rAN547aV60aym6GisSTiitP6oEqUfsfTwBg/exec";

        // 顯示自訂美化提示框函式
        function showToast(message, type = "success") {
            const toast = document.getElementById('toastNotification');
            const content = document.getElementById('toastContent');
            const msgEl = document.getElementById('toastMessage');
            const iconEl = document.getElementById('toastIcon');

            msgEl.textContent = message;

            if (type === "success") {
                content.className = "backdrop-blur-md bg-white/95 border border-cyan-300 text-slate-800 px-6 py-4 rounded-xl shadow-[0_0_30px_rgba(6,182,212,0.18)] flex items-center gap-3";
                iconEl.textContent = "🌊";
            } else {
                content.className = "backdrop-blur-md bg-white/95 border border-rose-300 text-slate-800 px-6 py-4 rounded-xl shadow-[0_0_30px_rgba(251,113,133,0.16)] flex items-center gap-3";
                iconEl.textContent = "⚠️";
            }

            toast.classList.remove('translate-y-24', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-24', 'opacity-0');
            }, 3500);
        }

        function showCartCount() {
            const cartCount = document.getElementById('cartCount').textContent;
            showToast(`購物車目前有 ${cartCount} 件商品`);
        }

        const worldClocks = [
            { id: 'taipei', timeZone: 'Asia/Taipei' },
            { id: 'tokyo', timeZone: 'Asia/Tokyo' },
            { id: 'singapore', timeZone: 'Asia/Singapore' },
            { id: 'london', timeZone: 'Europe/London' },
            { id: 'new-york', timeZone: 'America/New_York' }
        ].map(clock => ({
            ...clock,
            timeFormatter: new Intl.DateTimeFormat('zh-TW', {
                timeZone: clock.timeZone,
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hourCycle: 'h23',
                timeZoneName: 'short'
            }),
            dateFormatter: new Intl.DateTimeFormat('zh-TW', {
                timeZone: clock.timeZone,
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                weekday: 'short'
            })
        }));

        function updateWorldClocks() {
            const now = new Date();
            worldClocks.forEach(({ id, timeFormatter, dateFormatter }) => {
                const timeElement = document.getElementById(`clock-${id}`);
                timeElement.textContent = timeFormatter.format(now);
                timeElement.dateTime = now.toISOString();
                document.getElementById(`date-${id}`).textContent = dateFormatter.format(now);
            });
        }

        // 根據角色等級回傳對應的海洋色系 Badge 樣式
        function getRoleBadge(role) {
            switch (role) {
                case '管理員':
                    return `<span class="px-3 py-1 rounded-full text-xs font-semibold bg-cyan-50 border border-cyan-200 text-cyan-800">管理員</span>`;
                case '進階會員':
                    return `<span class="px-3 py-1 rounded-full text-xs font-semibold bg-sky-50 border border-sky-200 text-sky-800">進階會員</span>`;
                case '一般會員':
                default:
                    return `<span class="px-3 py-1 rounded-full text-xs font-semibold bg-teal-50 border border-teal-200 text-teal-800">${role || '一般會員'}</span>`;
            }
        }

        // 非同步讀取資料 (GET)
        async function fetchMembers() {
            const loadingOverlay = document.getElementById('loadingOverlay');
            const tableBody = document.getElementById('memberTableBody');

            // 顯示 Loading 動畫
            loadingOverlay.style.opacity = '1';
            loadingOverlay.style.pointerEvents = 'auto';

            try {
                const response = await fetch(`${API_URL}?action=read`);
                const result = await response.json();

                if (result.status === "success") {
                    const members = result.data || [];

                    if (members.length === 0) {
                        tableBody.innerHTML = `<tr><td colspan="4" class="text-center py-8 text-slate-500">目前尚無會員資料</td></tr>`;
                    } else {
                        tableBody.innerHTML = members.map(m => `
              <tr class="hover:bg-cyan-50 transition-colors duration-200">
                <td class="py-3 px-4 font-mono text-cyan-700">#${m.id}</td>
                <td class="py-3 px-4 font-medium text-slate-800">${escapeHtml(m.name)}</td>
                <td class="py-3 px-4 text-slate-600">${escapeHtml(m.email)}</td>
                <td class="py-3 px-4">${getRoleBadge(m.role)}</td>
              </tr>
            `).join('');
                    }
                } else {
                    showToast(result.message || "讀取資料失敗", "error");
                }
            } catch (error) {
                console.error("Fetch error:", error);
                showToast("連線至伺服器失敗，請檢查 API_URL", "error");
                tableBody.innerHTML = `<tr><td colspan="4" class="text-center py-8 text-rose-600">連線錯誤，請確認 API 設定</td></tr>`;
            } finally {
                // 隱藏 Loading 動畫
                loadingOverlay.style.opacity = '0';
                loadingOverlay.style.pointerEvents = 'none';
            }
        }

        // 防止 XSS 的簡單跳脫函式
        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        // 監聽表單提交事件 (POST)
        document.getElementById('memberForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            const originalBtnHtml = submitBtn.innerHTML;

            // 將按鈕轉為 Loading 載入狀態，防止重複點擊
            submitBtn.disabled = true;
            submitBtn.innerHTML = `
        <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span>加入中...</span>
      `;

            const payload = {
                name: document.getElementById('name').value.trim(),
                email: document.getElementById('email').value.trim(),
                role: document.getElementById('role').value
            };

            try {
                // 使用 text/plain 避開 CORS 限制
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'text/plain;charset=utf-8'
                    },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (result.status === "success") {
                    showToast(result.message || "資料新增成功！", "success");
                    // 清空表單
                    document.getElementById('memberForm').reset();
                    // 自動重新呼叫 fetchMembers 刷新右側表格
                    await fetchMembers();
                } else {
                    showToast(result.message || "新增失敗", "error");
                }
            } catch (error) {
                console.error("POST error:", error);
                showToast("請求發送失敗，請檢查網路或 API 設定", "error");
            } finally {
                // 恢復按鈕狀態
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalBtnHtml;
            }
        });

        // 頁面載入完成後自動執行首次資料讀取
        window.addEventListener('DOMContentLoaded', () => {
            updateWorldClocks();
            setInterval(updateWorldClocks, 1000);

            // 提醒：如果是剛貼上範本，請記得將 API_URL 替換成你的 Google Apps Script 部署網址
            if (API_URL.includes("https://script.google.com/macros/s/AKfycbzYP3ngTDRs9qLZ_gVqHPixODWhGKb4ql8rAN547aV60aym6GisSTiitP6oEqUfsfTwBg/exec")) {
                document.getElementById('loadingOverlay').style.opacity = '0';
                document.getElementById('loadingOverlay').style.pointerEvents = 'none';
                document.getElementById('memberTableBody').innerHTML = `<tr><td colspan="4" class="text-center py-8 text-amber-700">請先在程式碼中將 <code class="text-amber-800">API_URL</code> 替換為你的 Google Apps Script 網頁應用程式 URL！</td></tr>`;
                return;
            }
            fetchMembers();
        });
    </script>
</body>

</html>
